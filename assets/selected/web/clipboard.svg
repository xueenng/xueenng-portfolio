<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 626" width="520" height="626" preserveAspectRatio="none">
  <!-- Ink line-art clipboard. PAPER RECTANGLE IS THE CONTRACT: x 8%-92% (41.6..478.4),
       y 12%-96% (75.1..600.9) of the viewBox; css positions .dw-paper-space on it. -->
  <g stroke="#3b2a12" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- board -->
    <rect x="12" y="34" width="496" height="584" rx="26" fill="#e9d8b3" stroke-width="5"/>
    <rect x="22" y="44" width="476" height="564" rx="20" stroke-width="1.5" opacity=".45"/>
    <!-- hatched corners -->
    <g stroke-width="2" opacity=".35">
      <path d="M24 70 l14 -14 M24 96 l40 -40 M24 122 l66 -66"/>
      <path d="M496 70 l-14 -14 M496 96 l-40 -40 M496 122 l-66 -66"/>
      <path d="M24 582 l14 14 M24 556 l40 40 M24 530 l66 66"/>
      <path d="M496 582 l-14 14 M496 556 l-40 40 M496 530 l-66 66"/>
    </g>
    <!-- paper (the contract rectangle) -->
    <rect x="41.6" y="75.1" width="436.8" height="525.8" fill="#fbf3dc" stroke-width="3"/>
    <path d="M41.6 75.1 h34 v34 h-34 z" fill="#efe3c4" stroke-width="1.5"/>
    <!-- spring clip -->
    <rect x="164" y="6" width="192" height="66" rx="16" fill="#e9d8b3" stroke-width="5"/>
    <rect x="186" y="22" width="148" height="22" rx="8" stroke-width="3"/>
    <path d="M214 72 q46 24 92 0" stroke-width="4"/>
    <circle cx="260" cy="33" r="6" fill="#3b2a12" stroke="none"/>
  </g>
</svg>
